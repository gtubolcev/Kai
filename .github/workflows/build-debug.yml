name: Build Debug APK

on:
  push:
    branches:
      - feature/caldav

permissions:
  contents: read

jobs:
  apk:
    name: Build Debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Set execution flag for gradlew
        run: chmod +x gradlew

      - name: Restore debug keystore
        env:
          DEBUG_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_B64" ]; then
            mkdir -p ~/.android
            echo "$DEBUG_KEYSTORE_B64" | base64 --decode > ~/.android/debug.keystore
          fi

      - name: Generate Compose resources
        run: ./gradlew :composeApp:generateResourceAccessorsForCommonMain --no-build-cache --rerun-tasks

      - name: Check generated file before build
        run: |
          echo "=== String0 contains litert_error_auth ==="
          grep -c "litert_error_auth" composeApp/build/generated/compose/resourceGenerator/kotlin/commonMainResourceAccessors/kai/composeapp/generated/resources/String0.commonMain.kt || echo "MISSING"
          echo "=== All generated String*.kt files ==="
          ls -la composeApp/build/generated/compose/resourceGenerator/kotlin/commonMainResourceAccessors/kai/composeapp/generated/resources/String*.kt

      - name: Build Debug APK
        run: ./gradlew :androidApp:assembleFossDebug --stacktrace --no-build-cache

      - name: Check generated file after build (if failed)
        if: failure()
        run: |
          echo "=== String0 contains litert_error_auth after build ==="
          grep -c "litert_error_auth" composeApp/build/generated/compose/resourceGenerator/kotlin/commonMainResourceAccessors/kai/composeapp/generated/resources/String0.commonMain.kt || echo "MISSING - FILE WAS OVERWRITTEN"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: androidApp/build/outputs/apk/foss/debug/androidApp-foss-debug.apk
          retention-days: 7
