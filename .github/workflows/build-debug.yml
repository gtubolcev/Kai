name: Build Debug APK

on:
  push:
    branches:
      - feature/caldav

permissions:
  contents: read

jobs:
  apk:
    name: Build Debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Set execution flag for gradlew
        run: chmod +x gradlew

      - name: Restore debug keystore
        if: ${{ secrets.DEBUG_KEYSTORE_B64 != '' }}
        run: |
          mkdir -p ~/.android
          echo "${{ secrets.DEBUG_KEYSTORE_B64 }}" | base64 --decode > ~/.android/debug.keystore

      - name: Build Debug APK
        run: ./gradlew :androidApp:assembleFossDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: androidApp/build/outputs/apk/foss/debug/androidApp-foss-debug.apk
          retention-days: 7
